info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: https://birdid-api.onrender.com/login
  body:
    type: json
    data: |
      {
        "email": "email@email.com",
        "password": "email123"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        if (body && body.token) {
          bru.setEnvVar("authToken", body.token);

          console.log("Token JWT stocké avec succès !");
        } else {
          console.error("Le token est introuvable dans la réponse.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
