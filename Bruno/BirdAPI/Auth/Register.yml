info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/auth/register
  headers:
    - name: username
      value: TestUser
  body:
    type: json
    data: |
      {
        "userName": "TestUser",
        "email": "test@example.com",
        "password": "password123",
        "notes": "Ceci est un utilisateur de test.",
        "points": 100,
        "avatar": "0"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
